<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Events | Sunshine Community Foundation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">Sunshine Community Foundation</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="search.html" class="active">Search Events</a>
        </div>
    </nav>

    <main class="wrap">

        <h1 class="section-title" style="margin-top:0;">Search Charity Events</h1>
        <p>Find an event by date, location and/or category. You may use one or more filters.</p>

        <!-- Search / filter form -->
        <div class="form-card">
            <form id="search-form" class="form-row">
                <div class="form-group">
                    <label for="f-date">Date</label>
                    <input type="date" id="f-date" name="date">
                </div>
                <div class="form-group">
                    <label for="f-location">Location</label>
                    <input type="text" id="f-location" name="location"
                           placeholder="e.g. Sydney, Park, Harbour">
                </div>
                <div class="form-group">
                    <label for="f-category">Category</label>
                    <select id="f-category" name="category">
                        <option value="">All categories</option>
                        <!-- categories injected from GET /api/categories -->
                    </select>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn">Search</button>
                </div>
                <div class="form-group">
                    <button type="button" id="clear-btn" class="btn btn-secondary">Clear Filters</button>
                </div>
            </form>
        </div>

        <!-- Error message container (shown via DOM when the request fails) -->
        <div class="error-msg" id="error-msg"></div>

        <h2 class="section-title" id="results-title" hidden>Search Results</h2>

        <p class="loading" id="loading" hidden>Loading events&hellip;</p>
        <p class="empty" id="no-results" hidden>No events match your search.</p>

        <div class="grid" id="results-grid"></div>

    </main>

    <script src="js/api.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
